<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Circle Gradient -->
    <linearGradient id="globeGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <!-- Sprouting Leaf Gradient -->
    <linearGradient id="leafGrad" x1="16" y1="48" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <!-- Secondary Leaf Gradient -->
    <linearGradient id="leafSubGrad" x1="32" y1="44" x2="52" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="6" y1="32" x2="58" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Globe Base Sphere -->
  <circle cx="32" cy="32" r="26" fill="url(#globeGrad)" />

  <!-- Geodesic Longitude / Latitude Curves -->
  <ellipse cx="32" cy="32" rx="13" ry="26" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none" />
  <ellipse cx="32" cy="32" rx="26" ry="11" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5" fill="none" />
  <line x1="6" y1="32" x2="58" y2="32" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  <line x1="32" y1="6" x2="32" y2="58" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Geospatial Orbit Ring -->
  <ellipse cx="32" cy="32" rx="30" ry="13" transform="rotate(-26 32 32)" stroke="url(#orbitGrad)" stroke-width="2.2" stroke-dasharray="3 2" fill="none" />
  <circle cx="58" cy="22" r="3.2" fill="#38bdf8" />
  <circle cx="58" cy="22" r="1.5" fill="#ffffff" />

  <!-- Primary Sprouting Leaf (Agriculture Core) -->
  <path d="M32 50 C26 38, 20 28, 24 16 C34 16, 42 24, 32 50 Z" fill="url(#leafGrad)" />
  <path d="M30 46 C27 36, 26 26, 28 20" stroke="#047857" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Secondary Companion Sprout -->
  <path d="M31 38 C36 32, 45 28, 46 22 C46 30, 40 37, 31 38 Z" fill="url(#leafSubGrad)" />

  <!-- Golden Radiance Node -->
  <circle cx="24" cy="16" r="2.2" fill="#fbbf24" />
</svg>
